name: Watch Doomsday BMS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_url:
        description: "Optional test BMS URL (leave blank for MSMA)"
        required: false
        default: ""
      test_date:
        description: "Optional test date YYYYMMDD (leave blank for 20261217)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check PVR Mani Square (MSMA)
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_URL: ${{ inputs.test_url }}
          TEST_DATE: ${{ inputs.test_date }}
        run: python check_once.py
